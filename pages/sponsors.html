<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners & Sponsors - APIGA India 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body class="bg-gray-50">
    <!-- Include Header -->
    <div id="header"></div>
    <!-- Main Content -->
    <section class="pt-36 pb-24">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-5xl font-bold text-center mb-16" data-aos="fade-up">Partners &amp; Sponsors</h1>
            <p class="text-center text-lg text-gray-700 mb-16" data-aos="fade-up" data-aos-delay="100">
               <strong>We are grateful for the support of our sponsors, media and community partners.</strong> 
            </p>
            
            <!-- Partners Banner -->
            <div class="mb-12" data-aos="fade-up">
                <div class="bg-white rounded-2xl shadow-md p-10 flex justify-center">
                    <img 
                        src="/images/partners/sponsors_2026.png" 
                        alt="APIGA India 2026 Partners and Sponsors" 
                        class="w-full h-auto object-contain mx-auto"
                        style="max-height: 320px; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- Include Footer -->
    <div id="footer"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="/js/main_component.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
